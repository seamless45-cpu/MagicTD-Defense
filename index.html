    <title>MagicTD Defense</title>
    <!-- Base styles are inline so the page is themed even if the app's JS/CSS never runs. -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #07051a;
        color: #eae6ff;
        font-family: "Rajdhani", system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      /* The static splash mirrors the in-app loading screen so the hand-off is invisible. */
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background:
          radial-gradient(1000px 500px at 15% -10%, rgba(84, 42, 190, 0.35), transparent 60%),
          radial-gradient(900px 500px at 90% 110%, rgba(255, 79, 216, 0.14), transparent 60%),
          radial-gradient(700px 400px at 70% 0%, rgba(53, 224, 255, 0.1), transparent 55%),
          linear-gradient(180deg, #100a2e, #07051a 70%);
        z-index: 1;
      }
      #boot-splash .stage {
        position: relative;
        display: grid;
        place-items: center;
        width: 168px;
        height: 168px;
      }
      #boot-splash .ring {
        position: absolute;
        border-radius: 999px;
      }
      #boot-splash .ring.outer {
        inset: 0;
        border: 2px dashed rgba(53, 224, 255, 0.32);
        animation: bootSpin 18s linear infinite;
      }
      #boot-splash .ring.inner {
        inset: 15px;
        border: 1px solid transparent;
        border-top-color: rgba(255, 207, 77, 0.9);
        border-right-color: rgba(255, 79, 216, 0.55);
        animation: bootSpin 7.5s linear infinite reverse;
      }
      #boot-splash .emblem {
        animation: bootFloat 2.6s ease-in-out infinite;
        filter: drop-shadow(0 0 16px rgba(255, 179, 36, 0.55));
      }
      #boot-splash .name {
        font-size: 38px;
        font-weight: 700;
        letter-spacing: 0.03em;
        line-height: 1;
        color: #ffb324;
        text-shadow: 0 0 34px rgba(255, 179, 36, 0.5);
      }
      #boot-splash .sub {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.45em;
        color: #35e0ff;
        margin-top: -6px;
      }
      #boot-splash .segs {
        display: flex;
        gap: 6px;
        width: 300px;
        max-width: 74vw;
        margin-top: 4px;
      }
      #boot-splash .segs i {
        flex: 1;
        height: 10px;
        border-radius: 999px;
        border: 1px solid #322767;
        background: rgba(8, 5, 26, 0.85);
        overflow: hidden;
      }
      #boot-splash .segs i::after {
        content: "";
        display: block;
        width: 30%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #35e0ff, #ff4fd8, #ffb324);
        animation: bootSlide 1.3s ease-in-out infinite;
      }
      #boot-splash .segs i:nth-child(2)::after {
        animation-delay: 0.12s;
      }
      #boot-splash .segs i:nth-child(3)::after {
        animation-delay: 0.24s;
      }
      #boot-splash .segs i:nth-child(4)::after {
        animation-delay: 0.36s;
      }
      #boot-splash .segs i:nth-child(5)::after {
        animation-delay: 0.48s;
      }
      #boot-splash .status {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        width: 300px;
        max-width: 74vw;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.3em;
        color: #9d93d6;
      }
      #boot-splash .status b {
        color: #ffcf4d;
      }
      @keyframes bootSlide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(340%);
        }
      }
      @keyframes bootSpin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes bootFloat {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .ring,
        #boot-splash .emblem,
        #boot-splash .segs i::after {
          animation: none;
        }
        #boot-splash .segs i::after {
          width: 100%;
        }
      }

		 * Generate an output sample from the input sample and parameters

		 * @param input number
		 * @param channel number
		 * @param parameters { [name: string]: number }

		 * Update the private params object with the 
		 * values of the parameters at the given index
		 * @param parameters { [name: string]: Float32Array },
		 * @param index number

			for (const paramName in parameters) {
				const param = parameters[paramName];
				if (param.length > 1) {

				} else {

		 * Process a single frame of the audio

	/**
	 * A multichannel buffer for use within an AudioWorkletProcessor as a delay line
	 */
	class DelayLine {
		
		constructor(size, channels) {
			this.buffer = [];
			this.writeHead = []
			this.size = size;

			// create the empty channels
			for (let i = 0; i < channels; i++) {
				this.buffer[i] = new Float32Array(this.size);
				this.writeHead[i] = 0;
			}
		}

		/**
		 * Push a value onto the end
		 * @param channel number
		 * @param value number
		 */
		push(channel, value) {
			this.writeHead[channel] += 1;
			if (this.writeHead[channel] > this.size) {
				this.writeHead[channel] = 0;
			}
			this.buffer[channel][this.writeHead[channel]] = value;
		}

		/**
		 * Get the recorded value of the channel given the delay
		 * @param channel number
		 * @param delay number delay samples
		 */
		get(channel, delay) {
			let readHead = this.writeHead[channel] - Math.floor(delay);
			if (readHead < 0) {
				readHead += this.size;
			}
			return this.buffer[channel][readHead];
		}
	}

            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px">' +
            '<div style="max-width:640px">' +
            '<div style="font-size:22px;font-weight:700;color:#ffb324;margin-bottom:8px">MagicTD could not start</div>' +
            '<p style="margin:0 0 10px;color:#9d93d6">The game&rsquo;s script did not run. Details:</p>' +
            '<ul style="margin:0;padding-left:18px;color:#ff8f9a">' +
            (rows || "<li>No error was reported &mdash; the script file may have been blocked or failed to load.</li>") +
            "</ul>" +
            '<p style="margin:12px 0 0;color:#9d93d6">Check the browser console / network tab, then reload.</p>' +
            "</div></div>";
          if (splash) splash.style.display = "none";
        }
        window.addEventListener(
          "error",
          function (e) {
            var t = e && e.target;
            if (t && t !== window && (t.src || t.href)) report("Failed to load: " + (t.src || t.href));
            else report((e && e.message) || "Unknown error");
            fill();
          },
          true
        );
        window.addEventListener("unhandledrejection", function (e) {
          report("Unhandled rejection: " + ((e.reason && e.reason.message) || e.reason));
          fill();
        });
        setTimeout(fill, 6000);
      })();
    </script>
